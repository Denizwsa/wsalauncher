name: Build Wsalauncher (macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "launcher-*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and CMake
        run: brew install qt cmake

      - name: Build and package
        run: |
          set -euo pipefail
          QT_PREFIX="$(brew --prefix qt@6 2>/dev/null || brew --prefix qt)"
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          chmod +x package-macos.sh run.sh Wsalauncher
          ./package-macos.sh

      - name: Upload macOS tarball
        uses: actions/upload-artifact@v4
        with:
          name: Wsalauncher-macOS
          path: dist/Wsalauncher-macOS.tar.gz

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/launcher-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wsalauncher-macOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
